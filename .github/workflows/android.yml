name: Verify web and Android preview
on: [push, pull_request, workflow_dispatch]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - run: npm run android
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      - run: ./gradlew testPreviewUnitTest assemblePreview
        working-directory: android
      - name: Verify packaged app and signature
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/preview/app-preview.apk DriveProfit-preview.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --verbose DriveProfit-preview.apk
          "$tools/aapt" dump badging DriveProfit-preview.apk > /tmp/driveprofit-badging
          grep -F "package: name='eg.driveprofit.app.preview'" /tmp/driveprofit-badging
          sha256sum DriveProfit-preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DriveProfit-preview
          path: |
            DriveProfit-preview.apk
            SHA256SUMS.txt
  publish-preview:
    needs: verify
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[apk-preview]')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: DriveProfit-preview }
      - name: Publish verified test build (not a production signing identity)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS.txt
          gh release create "preview-${GITHUB_SHA::8}" DriveProfit-preview.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'DriveProfit 0.3.1 — Android Preview' --notes 'Non-debuggable preview, signed with a test certificate. Android 6+ and a current Android System WebView required. Not a Play Store release. Future preview builds may require uninstalling; this removes local trips.'
